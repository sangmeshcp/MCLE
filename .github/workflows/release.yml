name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (otherwise build artifacts only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo xtask dist --target ${{ matrix.target }} --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release --locked -p mcle-cli --target x86_64-apple-darwin
          cargo build --release --locked -p mcle-cli --target aarch64-apple-darwin
          lipo -create -output mcle-universal \
            target/x86_64-apple-darwin/release/mcle target/aarch64-apple-darwin/release/mcle
          ./mcle-universal --version
          cargo xtask dist --target universal-apple-darwin --binary mcle-universal --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-universal-apple-darwin
          path: dist/

  publish:
    needs: [linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Resolve version (tag must be v<workspace version> or v<workspace version>-rc.N)
        id: version
        run: |
          base=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          version="$base"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^${base//./\\.}(-rc\.[0-9]+)?$ ]]; then
              echo "tag $GITHUB_REF_NAME does not match workspace version $base" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - run: cargo xtask dist --checksums dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: sigstore/cosign-installer@v3
      - name: Sign archives and checksums (keyless)
        run: |
          for f in dist/*.tar.gz dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease != 'true' }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.sigstore.json
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mcle" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.prerelease != 'true' && format('{0}:latest', steps.image.outputs.name) || '' }}
      - name: Sign image (keyless)
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Re-downloads everything that was published and checks it as a user would.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.publish.outputs.version }}
      IMAGE: ${{ needs.publish.outputs.image }}
      DIGEST: ${{ needs.publish.outputs.digest }}
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@v3
      - uses: docker/setup-qemu-action@v3
      - name: Download release assets
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel
      - name: Checksums
        run: cd rel && sha256sum -c SHA256SUMS
      - name: Signatures and provenance (archives)
        run: |
          for f in rel/*.tar.gz rel/SHA256SUMS; do
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "$f"
          done
          for f in rel/*.tar.gz; do gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"; done
      - name: Linux binaries are static and run
        run: |
          for t in x86_64 aarch64; do
            tar -xzf rel/mcle-*-$t-unknown-linux-musl.tar.gz -C rel
            file rel/mcle-*-$t-unknown-linux-musl/mcle | grep -q "statically linked\|static-pie"
          done
          rel/mcle-*-x86_64-unknown-linux-musl/mcle --version
      - name: Image signature, provenance and both platforms
        run: |
          cosign verify "$IMAGE@$DIGEST" --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"
          for p in linux/amd64 linux/arm64; do docker run --rm --platform "$p" "$IMAGE@$DIGEST" --version; done
          docker run -d --name mcle -p 4700:4700 "$IMAGE@$DIGEST"
          for i in $(seq 1 50); do curl -sf localhost:4700/_mcle/ready && break; sleep 0.2; done
          curl -sf localhost:4700/_mcle/info | grep -q '"clouds"'

  verify-macos:
    needs: publish
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.publish.outputs.version }}
    steps:
      - run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*universal-apple-darwin.tar.gz' --dir rel
          tar -xzf rel/*.tar.gz -C rel
          bin=$(echo rel/mcle-*-universal-apple-darwin/mcle)
          lipo -archs "$bin" | grep -q "x86_64 arm64"
          "$bin" --version
          "$bin" start --port 0 --port-file p.json & sleep 1
          curl -sf "http://localhost:$(python3 -c 'import json;print(json.load(open("p.json"))["http"])')/_mcle/ready"
