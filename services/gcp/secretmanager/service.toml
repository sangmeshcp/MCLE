[service]
cloud = "gcp"
name = "secretmanager"
display = "Secret Manager"
tier = "T0"
engines = ["crud"]
owners = ["@mcle/gcp"]
facade = "generic"

[service.api]
source = "googleapis/google-api-go-client@1be593613920c8bef887e96e1a82e9a97398628c (secretmanager/v1)"
format = "discovery"
spec = "specs/gcp/api/secretmanager.v1.json"
version = "v1"
iam_catalog = "specs/gcp/iam/secretmanager.json"

[defaults]
level = "L1"
plane = "control"

[crud.resources.secret]
parent_template = "projects/{projectsId}"
collection = "secrets"
id_query = "secretId"
id_param = "secretsId"
list_field = "secrets"
create_time = "createTime"
etag = "true"
total_size = "true"

[crud.resources.location_secret]
parent_template = "projects/{projectsId}/locations/{locationsId}"
collection = "secrets"
id_query = "secretId"
id_param = "secretsId"
list_field = "secrets"
create_time = "createTime"
etag = "true"
total_size = "true"

[ops."projects.locations.secrets.create"]
crud = "location_secret:create"

[ops."projects.locations.secrets.get"]
crud = "location_secret:read"

[ops."projects.locations.secrets.list"]
crud = "location_secret:list"

[ops."projects.locations.secrets.patch"]
crud = "location_secret:update"

[ops."projects.locations.secrets.delete"]
crud = "location_secret:delete"

[ops."projects.locations.secrets.addVersion"]
plane = "data"

[ops."projects.locations.secrets.versions.access"]
plane = "data"

[ops."projects.secrets.addVersion"]
plane = "data"

[ops."projects.secrets.versions.access"]
plane = "data"
