[workspace]
resolver = "2"
members = [
    "crates/*",
    "engines/*",
    "clouds/*",
    "services/*/*",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sangmeshcp/MCLE"
rust-version = "1.80"
publish = false

[workspace.dependencies]
# internal
mcle-sdk = { path = "crates/mcle-sdk" }
mcle-core = { path = "crates/mcle-core" }
mcle-persist = { path = "crates/mcle-persist" }
mcle-gateway = { path = "crates/mcle-gateway" }
mcle-iam = { path = "crates/mcle-iam" }
mcle-identity = { path = "crates/mcle-identity" }
mcle-runtime = { path = "crates/mcle-runtime" }
mcle-testkit = { path = "crates/mcle-testkit" }
mcle-bundle = { path = "crates/mcle-bundle", default-features = false }
mcle-engine-crud = { path = "engines/crud" }
mcle-cloud-aws = { path = "clouds/aws" }
mcle-cloud-azure = { path = "clouds/azure" }
mcle-cloud-gcp = { path = "clouds/gcp" }
mcle-cloud-oci = { path = "clouds/oci" }
mcle-cloud-ibm = { path = "clouds/ibm" }

anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dashmap = "6"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
