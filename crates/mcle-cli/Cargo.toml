[package]
name = "mcle-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "mcle"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde_json.workspace = true
mcle-bundle = { workspace = true, default-features = true }
mcle-core.workspace = true
mcle-gateway.workspace = true
mcle-persist.workspace = true
mcle-sdk.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["all"]
all = ["mcle-bundle/all"]
cloud-aws = ["mcle-bundle/all-aws"]
cloud-azure = ["mcle-bundle/all-azure"]
cloud-gcp = ["mcle-bundle/all-gcp"]
cloud-oci = ["mcle-bundle/all-oci"]
cloud-ibm = ["mcle-bundle/all-ibm"]

[dev-dependencies]
mcle-testkit.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/mcle-{ version }-{ target }.tar.gz"
bin-dir = "mcle-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/mcle-{ version }-universal-apple-darwin.tar.gz"
bin-dir = "mcle-{ version }-universal-apple-darwin/{ bin }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/mcle-{ version }-universal-apple-darwin.tar.gz"
bin-dir = "mcle-{ version }-universal-apple-darwin/{ bin }"

[lints]
workspace = true
